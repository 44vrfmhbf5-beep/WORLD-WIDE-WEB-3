<title>Atlas Onchain Search</title>
<meta name="description" content="One search bar for every chain. Assets, NFTs, yields, lending markets, protocols, stablecoins, bridges, funding rounds and exploits.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Non-blocking: a pending stylesheet blocks script execution, so a slow or
     unreachable font host would leave the shell rendered and the app dead. -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet" media="print" onload="this.media='all';this.onload=null">
<style>
/* Atlas &#8212; onchain search */
:root{
  --bg:#12121a; --bg2:#16161f; --surface:#1c1c27; --surface2:#22222f;
  --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.12);
  --text:#f4f3f8; --dim:#9a99ac; --faint:#67667a;
  /* American Express blue. It is darker than the violet it replaces, so
     anything sitting on it takes white rather than near-black. */
  --accent:#006fcf; --accent-dim:#3b8fdd; --on-accent:#fff;
  --up:#4ade80; --down:#ff6b81;
  --r:16px; --r-lg:22px;
  --ease:cubic-bezier(.22,.61,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--text); min-height:100svh;
  /* viewport-fit=cover is declared, so the page runs under the notch and the
     home indicator unless it pays the insets back */
  padding-left:env(safe-area-inset-left); padding-right:env(safe-area-inset-right);
  font:400 15px/1.5 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased; letter-spacing:-.01em;
  padding-bottom:calc(80px + env(safe-area-inset-bottom));
}
button,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;flex:none}

/* ambient glow */
.aurora{position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(680px 380px at 50% -8%,rgba(171,159,242,.22),transparent 70%),
    radial-gradient(520px 320px at 88% 4%,rgba(97,214,214,.10),transparent 70%),
    radial-gradient(460px 300px at 6% 12%,rgba(255,107,129,.07),transparent 70%);
}

/* header */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;
  gap:16px;padding:14px 22px;backdrop-filter:blur(14px);
  background:linear-gradient(180deg,rgba(18,18,26,.9),rgba(18,18,26,.55));
  border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;color:var(--text);text-decoration:none;
  font-weight:700;font-size:16px;letter-spacing:-.03em}
.mark{width:20px;height:20px;border-radius:7px;
  background:conic-gradient(from 200deg,#006fcf,#3fb6f5,#00d4b8,#006fcf);
  box-shadow:0 0 18px rgba(171,159,242,.5)}
.top-nav{display:flex;align-items:center;gap:12px}
.net{color:var(--faint);font-size:12.5px;font-weight:500}
.ghost-btn{display:flex;align-items:center;gap:8px;padding:7px 12px;border-radius:11px;
  background:var(--surface);border:1px solid var(--line);color:var(--dim);
  font-size:13px;font-weight:500;transition:.16s var(--ease)}
.ghost-btn:hover{background:var(--surface2);color:var(--text);border-color:var(--line2)}
kbd{font:inherit;font-size:11px;padding:1px 5px;border-radius:5px;background:rgba(255,255,255,.07);
  border:1px solid var(--line);color:var(--faint)}

/* width:100% is load-bearing &#8212; auto inline margins suppress a grid item's
   stretch, so without it .wrap is shrink-to-fit and its width drifts with
   whatever content happens to be tallest. */
.wrap{position:relative;z-index:1;width:100%;max-width:1120px;margin:0 auto;padding:0 22px;min-width:0}

/* hero */
.hero{text-align:center;padding:56px 0 26px;transition:.35s var(--ease)}
.hero h1{font-size:clamp(30px,6vw,44px);font-weight:700;letter-spacing:-.035em;line-height:1.08}
.hero em{font-style:normal;background:linear-gradient(100deg,#3b8fdd,#3fd0e8);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.hero .sub{margin-top:12px;color:var(--dim);font-size:15px}
.hero .sub span{color:var(--accent)}
.hero h1,.hero .sub{transition:font-size .3s var(--ease),opacity .22s var(--ease),
  transform .3s var(--ease),margin .3s var(--ease)}
body.searching .hero,body.browsing .hero{padding:20px 0 6px}
body.searching .hero h1,body.browsing .hero h1{font-size:0;opacity:0;margin:0;transform:translateY(-10px)}
body.searching .hero .sub,body.browsing .hero .sub{font-size:0;opacity:0;margin:0;transform:translateY(-6px)}

/* search */
.searchbar{position:sticky;top:64px;z-index:15;margin-top:16px;display:flex;align-items:center;gap:12px;
  padding:0 16px;height:58px;border-radius:var(--r-lg);
  background:var(--surface);border:1px solid var(--line2);
  box-shadow:0 12px 40px -14px rgba(0,0,0,.8);
  transition:.22s var(--ease)}
.searchbar:focus-within{border-color:var(--accent-dim);background:var(--surface2);
  box-shadow:0 0 0 4px rgba(171,159,242,.14),0 16px 44px -14px rgba(0,0,0,.9)}
.lens{color:var(--faint);width:20px;height:20px;transition:.2s}
.searchbar:focus-within .lens{color:var(--accent)}
#q{flex:1;background:none;border:0;outline:0;font-size:17px;font-weight:500;letter-spacing:-.015em;min-width:0}
#q::placeholder{color:var(--faint);font-weight:400}
.clear{display:grid;place-items:center;width:26px;height:26px;border-radius:8px;color:var(--faint);
  background:rgba(255,255,255,.06);transition:.15s}
.clear:hover{color:var(--text);background:rgba(255,255,255,.12)}

/* filters */
.filters{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:18px 2px 4px}
.tabs{display:flex;gap:3px;padding:3px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.tab{padding:6px 13px;border-radius:9px;font-size:13px;font-weight:600;color:var(--dim);transition:.16s var(--ease)}
.tab:hover{color:var(--text)}
.tab[aria-selected=true]{background:var(--surface2);color:var(--text);box-shadow:0 1px 8px rgba(0,0,0,.35)}
.chains{display:flex;gap:6px;overflow-x:auto;flex:1;padding:2px 0 6px;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,#000 92%,transparent)}
.chains::-webkit-scrollbar{display:none}
.chip{display:flex;align-items:center;gap:6px;padding:6px 11px 6px 7px;border-radius:999px;flex:none;
  background:var(--surface);border:1px solid var(--line);color:var(--dim);
  font-size:12.5px;font-weight:600;white-space:nowrap;transition:.16s var(--ease)}
.chip:hover{color:var(--text);border-color:var(--line2)}
.chip[aria-pressed=true]{color:var(--text);border-color:color-mix(in srgb,var(--c) 55%,transparent);
  background:color-mix(in srgb,var(--c) 14%,var(--surface))}
.dot{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none;box-shadow:0 0 8px var(--c)}
.chip.all .dot{background:linear-gradient(120deg,#006fcf,#3fd0e8)}

.meta{padding:14px 2px 10px;color:var(--faint);font-size:12.5px;font-weight:500;letter-spacing:.01em}

/* results */
.results{display:flex;flex-direction:column;gap:8px}
/* the sticky search bar overlays what scrolls under it; keep a row's worth clear */
.results .row,.results .hcard{scroll-margin-top:132px}
.wrap>#banner{margin-top:14px}
.row{display:flex;align-items:center;gap:14px;padding:13px 16px;border-radius:var(--r);
  background:var(--surface);border:1px solid transparent;cursor:pointer;text-align:left;width:100%;
  transition:background .16s var(--ease),border-color .16s,transform .16s var(--ease)}
.row.in{animation:in .3s var(--ease) both}
@keyframes in{from{opacity:0;transform:translateY(7px)}}
.row:hover{background:var(--surface2)}
/* Selection is a keyboard affordance, not a claim about the row. A ring around
   the first result reads as "this one is special", which it is not &#8212; the list
   is already in order. A quiet fill is enough to follow the arrow keys. */
.row.sel{background:var(--surface2)}
.row:active{transform:scale(.994)}

/* ---- warnings ----
   A mark on the row, not a wall of text: the reasons are in the sheet. Amber
   for something to weigh, red for something that decides it. */
.warnb{display:inline-flex;align-items:center;gap:3px;vertical-align:middle;
  min-width:17px;height:17px;padding:0 5px;border-radius:999px;
  font-size:10.5px;font-weight:700;line-height:1;letter-spacing:0;
  background:color-mix(in srgb,#f5a524 22%,transparent);color:#f5a524;cursor:help}
.warnb.bad{background:color-mix(in srgb,var(--down) 20%,transparent);color:var(--down)}
.warnb i{font-style:normal;font-size:10px;opacity:.85}
.flags{display:flex;flex-direction:column;gap:8px}
.flag{padding:10px 12px;border-radius:12px;background:var(--surface2);
  border-left:3px solid #f5a524}
.flag.bad{border-left-color:var(--down)}
/* context rather than a warning: said once, where somebody is already reading */
.flag.note{border-left-color:var(--line2)}
.flag .fl{display:block;font-size:13px;font-weight:600;color:var(--text)}
.flag .fw{display:block;margin-top:2px;font-size:12.5px;color:var(--dim);line-height:1.45}
.sec.risk .note{margin-top:10px}

/* 4-char tickers get a tighter face */
.tok.t4{font-size:9.5px;letter-spacing:-.04em}
.tok{width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center;
  font-size:12px;font-weight:700;letter-spacing:-.03em;color:#12121a;position:relative;
  background:linear-gradient(140deg,var(--c),color-mix(in srgb,var(--c) 45%,#fff))}
.tok.sq{border-radius:12px}
.tok .badge{position:absolute;right:-3px;bottom:-3px;width:15px;height:15px;border-radius:50%;
  background:var(--c2);border:2.5px solid var(--surface)}
.row:hover .tok .badge,.row.sel .tok .badge{border-color:var(--surface2)}

.body{flex:1;min-width:0}
.t1{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14.5px;letter-spacing:-.015em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t1 .sym{color:var(--faint);font-weight:500}
.t2{margin-top:2px;color:var(--dim);font-size:12.5px;display:flex;align-items:center;gap:7px;
  white-space:nowrap;overflow:hidden}
.t2 .sep{color:var(--faint);opacity:.5}
.tag{padding:2px 7px;border-radius:6px;background:rgba(255,255,255,.06);color:var(--dim);
  font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}

.num{text-align:right;flex:none;font-variant-numeric:tabular-nums}
.n1{font-weight:600;font-size:14.5px;letter-spacing:-.01em}
.n2{margin-top:2px;font-size:12.5px;font-weight:600}
.up{color:var(--up)}.down{color:var(--down)}
.n2.mute{color:var(--faint);font-weight:500}
.spark{width:62px;height:26px;flex:none;opacity:.85}
/* The second line sheds what it can afford to, worst first. The tag repeats the
   category you are already in; the network is still on the token as a coloured
   badge; the figure is the reason the row exists, so it is the last to go. */
@media (max-width:560px){.spark{display:none}.t2 .tag{display:none}}
@media (max-width:380px){.t2 .mi,.t2 .sep{display:none}}

.empty{text-align:center;padding:60px 20px;color:var(--faint)}
.empty b{display:block;color:var(--text);font-size:16px;margin-bottom:6px;font-weight:600}
.gtitle{padding:16px 4px 6px;font-size:11.5px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:var(--faint)}

/* detail sheet */
.scrim{position:fixed;inset:0;z-index:30;background:rgba(8,8,12,.6);backdrop-filter:blur(3px);
  opacity:0;pointer-events:none;transition:opacity .3s var(--ease)}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:31;top:0;right:0;bottom:0;width:min(440px,100%);
  background:var(--bg2);border-left:1px solid var(--line);overflow-y:auto;
  transform:translateX(100%);transition:transform .32s var(--ease);visibility:hidden}
.sheet.open{transform:none;visibility:visible}
.sheet-in{padding:22px 24px 40px}
.sheet-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:22px}
.x{display:grid;place-items:center;width:32px;height:32px;border-radius:10px;color:var(--dim);
  background:var(--surface);border:1px solid var(--line);transition:.15s}
.x:hover{color:var(--text);background:var(--surface2)}
.sheet h2{font-size:20px;font-weight:700;letter-spacing:-.025em}
.sheet .hsub{color:var(--dim);font-size:13px;margin-top:3px}
.big{font-size:34px;font-weight:700;letter-spacing:-.035em;font-variant-numeric:tabular-nums}
.chgline{display:flex;align-items:center;gap:8px;margin-top:4px;font-size:13.5px;font-weight:600}
.chgline .mute{color:var(--faint);font-weight:500}
.chart{margin:20px 0 4px;border-radius:var(--r);overflow:hidden;background:var(--surface);
  border:1px solid var(--line);padding:14px 0 0}
.chart svg{display:block;width:100%;height:auto}
.rangebar{display:flex;gap:4px;padding:8px 12px 10px}
.rangebar span{padding:4px 9px;border-radius:7px;font-size:11.5px;font-weight:600;color:var(--faint)}
.rangebar span.on{background:var(--surface2);color:var(--text)}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.stat{padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.stat .k{color:var(--faint);font-size:11.5px;font-weight:600;letter-spacing:.03em;text-transform:uppercase}
.stat .v{margin-top:5px;font-size:16px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat.wide{grid-column:1/-1}
.util{margin-top:9px;height:6px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
.util i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),#3fd0e8);
  animation:grow .5s var(--ease) both}
@keyframes grow{from{width:0!important}}

.sec{margin-top:26px}
.sec h3{font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--faint);margin-bottom:9px}
.mini{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:13px;width:100%;
  background:var(--surface);border:1px solid transparent;text-align:left;transition:.15s var(--ease);
  margin-bottom:6px;cursor:pointer}
.mini:hover{background:var(--surface2);border-color:var(--line2)}
.mini .tok{width:30px;height:30px;font-size:10px}
.mini .body .t1{font-size:13.5px}
.mini .body .t2{font-size:12px}
.mini .num .n1{font-size:13.5px}
.cta{display:flex;flex-wrap:wrap;gap:9px;margin-top:24px}
.cta button,.cta a{flex:1 1 45%;padding:13px;border-radius:14px;font-size:14px;font-weight:600;
  transition:.16s var(--ease);text-align:center}
.cta .p{flex-basis:100%}
.cta .p{background:var(--accent);color:var(--on-accent);box-shadow:0 8px 24px -10px var(--accent)}
.cta .p:hover{background:#1a86e8;transform:translateY(-1px)}
.cta .s{background:var(--surface);border:1px solid var(--line2);color:var(--text)}
.cta .s:hover{background:var(--surface2)}
.note{margin-top:14px;text-align:center;color:var(--faint);font-size:11.5px}

@media (max-width:640px){
  .top{padding:12px 16px}.wrap{padding:0 14px}
  /* Four controls do not fit a phone header, and the search hint is the one
     that says least: the search bar itself is the first thing under it, and
     there is no keyboard to press "/" on. The network count moved into the
     chain button long ago. */
  .top-nav{gap:8px;min-width:0}
  .net,#topSearch{display:none}
  .ghost-btn.wallet{max-width:44vw}
  .ghost-btn.wallet span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .hero{padding:34px 0 18px}
  .hero .sub{font-size:14px;max-width:22em;margin-inline:auto}
  .searchbar{top:60px;height:54px}
  .row{padding:12px 13px;gap:11px}
  .sheet{width:100%;top:auto;height:92dvh;border-left:0;border-top:1px solid var(--line);
    border-radius:24px 24px 0 0;transform:translateY(100%);
    padding-bottom:env(safe-area-inset-bottom)}
  .stats{grid-template-columns:1fr 1fr}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ---- live data: logos, skeletons, banners, watchlist ---- */
.tok{position:relative;overflow:visible}
.tok img{position:absolute;inset:0;width:100%;height:100%;border-radius:inherit;object-fit:cover;
  opacity:0;transition:opacity .25s var(--ease)}
/* A logo with transparency let the initials underneath show through it, which
   read as two things stacked. Once an image loads it is the whole tile. */
.tok.img{color:transparent;background:var(--surface2)}
.tok .badge{z-index:1}
.ghost-btn.icon{padding:7px}
.ghost-btn.icon .i{width:16px;height:16px}
#refresh:active .i{transform:rotate(180deg);transition:transform .4s var(--ease)}

.star{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;flex:none;
  color:var(--faint);opacity:0;transition:.15s var(--ease)}
.star .i{width:16px;height:16px;stroke-width:1.7}
.row:hover .star,.row.sel .star,.star.on,.star:focus-visible{opacity:1}
.star:hover{background:rgba(255,255,255,.08);color:var(--text)}
.star.on{color:#ffc960;opacity:1}
.star.on .i{fill:#ffc960;stroke:#ffc960}
.acts .star{opacity:1;width:32px;height:32px;border-radius:10px;background:var(--surface);border:1px solid var(--line)}
@media (hover:none){.star{opacity:1}}

/* skeletons */
.row.sk{cursor:default;pointer-events:none}
.row.sk .tok,.ln{background:linear-gradient(100deg,var(--surface2) 30%,rgba(255,255,255,.07) 50%,var(--surface2) 70%);
  background-size:220% 100%;animation:shimmer 1.4s linear infinite}
.row.sk .body{display:flex;flex-direction:column;gap:7px}
.ln{height:10px;border-radius:6px}
.w40{width:40%}.w25{width:25%}.w15{width:64px;height:14px;flex:none}
@keyframes shimmer{to{background-position:-220% 0}}

.cload{height:136px;display:grid;place-items:center;color:var(--faint);font-size:12.5px}
.cload:not(.err){background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.05) 50%,transparent 70%);
  background-size:220% 100%;animation:shimmer 1.4s linear infinite}

.warn{display:flex;align-items:center;gap:10px;margin-top:14px;padding:10px 14px;border-radius:13px;
  background:rgba(255,201,96,.09);border:1px solid rgba(255,201,96,.25);color:#ffd68a;font-size:13px}
.warn button{margin-left:auto;padding:4px 10px;border-radius:8px;background:rgba(255,255,255,.1);
  color:inherit;font-size:12px;font-weight:600;flex:none}
.warn button:hover{background:rgba(255,255,255,.18)}

.sheet-top .ident{display:flex;gap:12px;align-items:center;min-width:0}
.sheet-top .ident h2{overflow-wrap:anywhere}
.sheet-top .acts{display:flex;gap:6px;flex:none}
.note.l{text-align:left;margin-top:0}
/* about: prose, so it gets a reading measure and a little more line height */
.sec.about .note{line-height:1.55;color:var(--dim);max-width:62ch}
/* the source's own words, set apart from the line we composed */
.sec.about .src{margin-top:9px;padding-left:11px;border-left:2px solid var(--line2);color:var(--faint)}
.cta a{display:grid;place-items:center;text-decoration:none}
.cta.one{margin-top:18px;justify-content:center}
.cta.one button,.cta.one a{flex:0 0 auto;padding:11px 22px}
.rangebar span{cursor:pointer}
.rangebar span:hover{color:var(--dim)}
.empty .cta{max-width:220px;margin-inline:auto}
/* ---- trade ----
   An amount, a quote, and one button. The quote block is deliberately loud:
   it is the last thing anyone reads before signing. */
.tform{display:flex;gap:10px;align-items:stretch;margin-bottom:12px}
.tamt{flex:1;display:flex;align-items:center;gap:8px;min-width:0;padding:9px 13px;
  border-radius:12px;background:var(--surface2);border:1px solid var(--line)}
.tamt:focus-within{border-color:var(--accent-dim)}
.tamt span{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}
.tamt input{flex:1;min-width:0;background:none;border:0;outline:none;
  font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
.tamt b{font-size:13px;color:var(--dim)}
.tform .p{flex:none}

/* ---- wallet ----
   The one control that changes what the app can do, so it is the one control
   in the header wearing the accent &#8212; and it reads as a state rather than a
   button once it holds something. */
.ghost-btn.wallet{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.ghost-btn.wallet:hover{background:var(--accent-dim);border-color:var(--accent-dim);color:var(--on-accent)}
.ghost-btn.wallet.on{color:var(--on-accent);border-color:var(--accent-dim);
  background:color-mix(in srgb,var(--accent) 78%,#000)}
.ghost-btn.wallet span{font-variant-numeric:tabular-nums}
.wsec{margin-top:22px}
.wsec:first-of-type{margin-top:18px}
.wsec h3{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--faint);margin-bottom:9px}
.wrow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.wrow input{flex:1 1 150px;min-width:0;padding:12px 13px;border-radius:12px;background:var(--surface);
  border:1px solid var(--line2);color:var(--text);font-size:14px;font-family:inherit}
.wrow input:focus{outline:none;border-color:var(--accent-dim)}
.wrow button{flex:0 0 auto;padding:12px 16px;border-radius:12px;font-size:13.5px;font-weight:600;
  transition:.14s var(--ease)}
.wrow .p{background:var(--accent);color:var(--on-accent)}
.wrow .p:hover:not(:disabled){background:#1a86e8}
.wrow .p:disabled{opacity:.6}
.wrow .s{flex:1 1 auto;background:var(--surface);border:1px solid var(--line2);color:var(--text)}
.wrow .s:hover{background:var(--surface2)}
.wor{margin:14px 0 0;text-align:center;font-size:11.5px;color:var(--faint)}
.waddr{display:flex;align-items:center;gap:9px;margin-top:8px;padding:11px 13px;border-radius:12px;
  background:var(--surface);border:1px solid var(--line)}
.waddr .k{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--faint);flex:none}
.waddr code{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-size:12.5px;color:var(--dim)}
.waddr .copy{flex:none;font-size:11.5px;font-weight:600;color:var(--accent)}
.note.err{color:#ff8a8a;border-left:2px solid #ff8a8a;padding-left:11px;text-align:left;margin-top:14px}

/* what is actually for sale inside a collection */
.sec.items .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
/* an item you can buy says so on itself, rather than sending you elsewhere */
.sec.items .item{position:relative}
.sec.items .ilink{display:block;color:inherit;text-decoration:none}
.sec.items .buy{position:absolute;right:7px;bottom:7px;padding:5px 11px;border-radius:9px;
  font-size:12px;font-weight:600;background:var(--accent);color:var(--on-accent);
  opacity:0;transition:.15s var(--ease);z-index:1}
.sec.items .item:hover .buy,.sec.items .buy:focus-visible{opacity:1}
.sec.items .buy:disabled{opacity:.6}
.s.card{margin-top:10px;display:inline-flex}
.sec.items .item{display:block;border-radius:12px;overflow:hidden;background:var(--surface);
  border:1px solid var(--line);text-decoration:none;transition:.14s var(--ease)}
.sec.items .item:hover{border-color:var(--line2);transform:translateY(-1px)}
.sec.items .ph{position:relative;aspect-ratio:1;background:var(--surface2)}
.sec.items .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  opacity:0;transition:opacity .25s var(--ease)}
.sec.items .in{padding:7px 8px 6px}
.sec.items .t{font-size:11.5px;font-weight:600;color:var(--text);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sec.items .p{font-size:11.5px;font-weight:600;color:var(--accent-dim);
  font-variant-numeric:tabular-nums;margin-top:1px}
.sec.items .tr{padding:0 8px 7px;font-size:10.5px;color:var(--faint);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* a quote is live data, so it reads like the numbers elsewhere, not like chrome */
.sec.trade .quote{padding:12px 14px;border-radius:13px;background:var(--surface);
  border:1px solid var(--line);margin-bottom:10px}
.sec.trade .qline{font-size:15px;color:var(--text)}
.sec.trade .qline b{font-weight:600;font-variant-numeric:tabular-nums}
.sec.trade .qmeta{margin-top:4px;font-size:11.5px;color:var(--faint)}
.sec.trade .cta{margin-top:12px}

/* All, with nothing typed: the categories themselves, not a sample of each &#8212;
   a column of horizontal cards that cycles forever. The track holds the list
   twice and travels exactly one copy, so the seam never lands on screen. */
.results.home{display:block}
.loop{position:relative;height:min(60vh,470px);overflow:hidden;
  -webkit-mask-image:linear-gradient(180deg,transparent,#000 9%,#000 91%,transparent);
          mask-image:linear-gradient(180deg,transparent,#000 9%,#000 91%,transparent)}
.track{display:flex;flex-direction:column;gap:10px;
  animation:cycle calc(var(--n,12) * 2.4s) linear infinite}
/* one copy of the list, plus one gap, is exactly what the seam needs */
@keyframes cycle{to{transform:translateY(calc(-50% - 5px))}}
/* reaching for a card it must hold still, and a keyboard is reaching too */
.loop:hover .track,.loop:focus-within .track{animation-play-state:paused}
.hcard{display:flex;align-items:center;gap:14px;flex:none;width:100%;
  padding:15px 18px;border-radius:16px;text-align:left;
  background:var(--surface);border:1px solid var(--line);
  transition:background .16s var(--ease),border-color .16s,transform .16s var(--ease)}
.hcard:hover{background:var(--surface2);border-color:var(--accent-dim);transform:translateX(4px)}
.hcard .hi{flex:none;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;
  font-size:15px;font-weight:700;color:var(--on-accent);letter-spacing:-.02em;
  background:linear-gradient(140deg,var(--accent),var(--accent-dim))}
.hcard .ht{flex:1;min-width:0}
.hcard .ht b{display:block;font-size:15px;font-weight:600;color:var(--text)}
.hcard .ht em{display:block;margin-top:2px;font-size:12.5px;font-style:normal;color:var(--faint)}
.hcard .hn{flex:none;font-size:19px;font-weight:600;color:var(--accent-dim);
  font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.hcard .hgo{flex:none;width:18px;color:var(--faint);transition:.16s var(--ease)}
.hcard:hover .hgo{color:var(--accent-dim);transform:translateX(3px)}
@media (prefers-reduced-motion:reduce){
  /* the loop is decoration; the list is the content, so it stays and stops */
  .loop{height:auto;-webkit-mask-image:none;mask-image:none}
  .track{animation:none}
  .track>[aria-hidden=true]{display:none}
}
.pickgrid .chip.cat{justify-content:space-between}
.pickgrid .chip.cat .ct{font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
.pickgrid .chip.cat.on{background:color-mix(in srgb,var(--accent) 16%,var(--surface2));
  border-color:var(--accent-dim);color:var(--text)}
.catbtn{display:flex;align-items:center;gap:7px;padding:9px 13px;border-radius:999px;
  background:var(--surface);border:1px solid var(--line2);color:var(--text);
  font-size:13px;font-weight:600;white-space:nowrap}
.catbtn:hover{background:var(--surface2)}
.catbtn .ch{width:14px;height:14px;opacity:.6;margin-left:-2px}

/* a category holds far more than a screen; this is the way to the rest of it */
.more{display:block;width:100%;margin-top:10px;padding:13px;border-radius:14px;
  background:var(--surface);border:1px solid var(--line);color:var(--dim);
  font-size:13px;font-weight:600;transition:.14s var(--ease)}
.more:hover{background:var(--surface2);color:var(--text);border-color:var(--line2)}
/* the thing you most often want next is the thing you just looked at */
.seen{margin-top:22px;text-align:left}
.seen h3{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--faint);margin-bottom:8px}

/* ---- fluidity + focus ---- */
.results{transition:opacity .18s var(--ease)}
.results.stale{opacity:.45;pointer-events:none}   /* chain loading, not a skeleton flash */

:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row:focus-visible,.mini:focus-visible{outline-offset:-2px}
#q:focus-visible{outline:none}

.rangebar span{transition:background .15s var(--ease),color .15s var(--ease)}
.chip,.tab,.row,.mini{-webkit-tap-highlight-color:transparent}
.mini{transition:background .15s var(--ease),border-color .15s var(--ease),transform .15s var(--ease)}
.mini:active{transform:scale(.99)}

/* sample-data notice: informational, not an error &#8212; reads as part of the system */
.sample{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;margin-top:14px;padding:11px 15px;
  border-radius:13px;font-size:13px;line-height:1.45;color:#cfc7ff;
  background:linear-gradient(90deg,rgba(171,159,242,.14),rgba(171,159,242,.05));
  border:1px solid rgba(171,159,242,.3)}
.sample b{color:var(--text);font-weight:600}
.pulse{color:var(--accent);animation:blink 1.2s ease-in-out infinite}
@keyframes blink{50%{opacity:.4}}

/* ---- interactive chart ---- */
.chart-svg{position:relative;outline-offset:-2px;padding-bottom:17px}
.chart-svg svg{display:block;width:100%;height:120px;touch-action:none}
/* the high/low envelope behind the close line, and a hairline at the range's
   opening value so the move is visible against something */
.chart-svg .band{opacity:0;animation:fadein .5s .35s var(--ease) forwards}
/* period high and low: where, not just how much. Circles in the svg now that
   it is drawn 1:1 &#8212; as positioned elements they were measuring the host box
   while the geometry was computed against the plot, and sat off the line. */
.chart svg .pin{stroke:var(--bg);stroke-width:2.5;opacity:0;
  animation:fadein .4s .6s var(--ease) forwards}
.chart svg .pin.tr{opacity:0;animation:fadedim .4s .6s var(--ease) forwards}
@keyframes fadedim{to{opacity:.55}}
.chart-svg .base{stroke:var(--line2);stroke-width:1}
.chart-svg .vol rect{transform-box:fill-box;transform-origin:bottom;
  animation:rise .5s var(--ease) both}
@keyframes rise{from{transform:scaleY(0)}}

/* axis labels are HTML, not SVG text: the svg is stretched to fit, which would
   stretch any text in it too */
.ax{position:absolute;font-size:10px;font-weight:600;letter-spacing:.02em;
  color:var(--faint);font-variant-numeric:tabular-nums;pointer-events:none;white-space:nowrap}
.ax.hi{top:2px;right:8px}
.ax.lo{top:76px;right:8px}
.ax.t0{bottom:1px;left:8px}
.ax.t1{bottom:1px;right:8px}
/* out of the bars' way: the panel is labelled above them, not across them */
.ax.vk{top:100px;right:8px;opacity:.72;font-size:9px;text-transform:uppercase;letter-spacing:.09em;
  padding:1px 5px;border-radius:5px;background:color-mix(in srgb,var(--bg) 76%,transparent)}
.chart-svg .line{stroke-dasharray:1400;stroke-dashoffset:1400;animation:draw .75s var(--ease) forwards}
.chart-svg .area{opacity:0;animation:fadein .5s .25s var(--ease) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fadein{to{opacity:1}}
.chart-svg .cx{position:absolute;top:0;bottom:0;width:1px;background:var(--line2);
  opacity:0;transition:opacity .12s;pointer-events:none}
.chart-svg .cdot{position:absolute;width:9px;height:9px;border-radius:50%;margin:-4.5px 0 0 -4.5px;
  box-shadow:0 0 0 2px var(--surface);opacity:0;transition:opacity .12s;pointer-events:none}
.chart-svg .tip{position:absolute;top:4px;transform:translateX(-50%);padding:4px 9px;border-radius:8px;
  background:var(--surface2);border:1px solid var(--line2);font-size:11.5px;
  font-variant-numeric:tabular-nums;white-space:nowrap;opacity:0;transition:opacity .12s;
  pointer-events:none;display:flex;flex-direction:column;gap:1px;align-items:center}
/* the value leads, the label follows: here the reader has the point and wants the number */
.chart-svg .tip b{font-weight:700;color:var(--text)}
.chart-svg .tip span{font-size:10px;font-weight:500;color:var(--faint)}
.nohist{position:absolute;inset:auto 0 8px;text-align:center;color:var(--faint);font-size:11.5px}
@media (prefers-reduced-motion:reduce){.chart-svg .line{animation:none;stroke-dashoffset:0}
  .chart-svg .area,.chart-svg .band{animation:none;opacity:1}
  .chart-svg .vol rect{animation:none}}


/* ---- layout: DefiLlama's rail, Aave's calm ----
   A persistent category rail down the left is what makes DefiLlama scannable.
   The row rhythm, the size of the primary number and the amount of air around
   it are Aave's. Both are on screen at once. */
.app{display:grid;grid-template-columns:212px minmax(0,1fr);align-items:start;gap:0}
.app>*{min-width:0}

.rail{position:sticky;top:56px;z-index:10;align-self:start;height:calc(100vh - 56px);
  display:flex;flex-direction:column;gap:18px;padding:22px 12px 20px 20px;
  border-right:1px solid var(--line);overflow-y:auto;scrollbar-width:thin}
.railnav{display:flex;flex-direction:column;gap:2px}
.railnav .tab{display:flex;align-items:center;gap:10px;width:100%;padding:8px 11px;border-radius:10px;
  font-size:13.5px;font-weight:600;color:var(--dim);text-align:left;white-space:nowrap;
  transition:.14s var(--ease)}
.railnav .tab:hover{color:var(--text);background:var(--surface)}
.railnav .tab[aria-selected=true]{background:var(--surface2);color:var(--text)}
/* the accent bead carries the selection, so the label never has to shout */
.railnav .tab::before{content:"";width:3px;height:15px;border-radius:2px;background:transparent;flex:none}
.railnav .tab[aria-selected=true]::before{background:var(--accent)}
.railnav .tab .ct{margin-left:auto;font-size:11px;font-weight:600;color:var(--faint);
  font-variant-numeric:tabular-nums}
.chainbtn{display:none}
.railfoot{margin-top:auto;display:flex;flex-direction:column;gap:8px;min-height:0}
.railk{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);
  padding-left:11px}
/* a heading over each group: four things to scan instead of fourteen to read */
.railk.nav{margin:13px 0 5px}
.railnav>.railk.nav:first-child{margin-top:0}
.railchains{display:flex;flex-direction:column;gap:2px;overflow-y:auto;padding-right:2px;
  max-height:min(42vh,340px);scrollbar-width:thin}
.railchains .chip{border:0;background:none;border-radius:9px;padding:6px 10px;justify-content:flex-start}
.railchains .chip:hover{background:var(--surface)}
.railchains .chip[aria-pressed=true]{background:color-mix(in srgb,var(--c) 15%,var(--surface2));color:var(--text)}

/* aggregate bar &#8212; the numbers DefiLlama leads with, from data already loaded */

/* results header: what is on screen, and the one control that changes its shape */
.bar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.bar .meta{padding:14px 2px 10px}
.viewtools{display:flex;gap:6px;flex:none}
.vt{display:flex;align-items:center;gap:7px;padding:6px 11px;border-radius:10px;
  background:var(--surface);border:1px solid var(--line);color:var(--dim);
  font-size:12.5px;font-weight:600;transition:.15s var(--ease)}
.vt:hover{color:var(--text);border-color:var(--line2)}
.vt .i{width:15px;height:15px}

/* the results line: it truncates from the middle of its own sentence, never
   from a figure that some other element is counting on being visible */
.meta{display:flex;align-items:baseline;gap:8px;min-width:0}
.mtext{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.link{flex:none;color:var(--dim);font:inherit;text-decoration:underline;text-underline-offset:2px;
  text-decoration-color:var(--line2)}
.link::before{content:"&#183; ";text-decoration:none;color:var(--faint);opacity:.6}
.link:hover{color:var(--text)}

/* ---- table view ----
   Grid rows, not <table>: the same .row nodes the card view uses, so the keyed
   reconciler, selection, starring and keyboard nav all work unchanged. */
.results.table{gap:0}
.results.table .row{border-radius:0;border-left:0;border-right:0;border-top:0;
  border-bottom:1px solid var(--line);background:none;
  display:grid;grid-template-columns:var(--cols);align-items:center;gap:14px;padding:14px 12px}
.results.table .row:hover{background:var(--surface)}
.results.table .row.sel{background:var(--surface2);box-shadow:inset 3px 0 0 var(--accent);border-radius:0}
.thead{border-bottom:1px solid var(--line2)}
.results.table .name{display:flex;align-items:center;gap:12px;min-width:0}
.results.table .cell{text-align:right;font-variant-numeric:tabular-nums;font-size:14px;font-weight:600;
  letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.results.table .cell.txt{font-weight:500;color:var(--dim);font-size:13px}
.results.table .num,.results.table .spark{display:none}
.results.table .star{margin-left:4px}

.thead{display:grid;grid-template-columns:var(--cols);gap:14px;padding:0 12px 8px;
  position:sticky;top:118px;z-index:9;background:var(--bg)}
.thead span,.thead button{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--faint);text-align:right;white-space:nowrap}
.thead .name{text-align:left;justify-content:flex-start}
.thead button{display:block;width:100%;transition:color .14s}
.thead button:hover{color:var(--dim)}
.thead button[aria-sort]{color:var(--accent)}
.thead button[aria-sort=ascending]::after{content:" \2191"}
.thead button[aria-sort=descending]::after{content:" \2193"}

/* compact = DefiLlama; comfortable = Aave. One class between them. */
.results.compact .row{padding:8px 12px}
.results.compact .tok{width:26px;height:26px;font-size:10px}
.results.compact .t1{font-size:13px}
.results.compact .t2{display:none}
.results.compact .cell{font-size:13px}

@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}

  /* Reclaim the first screen. Measured at 390x844 the chrome ran to y=474
     before a single row: a decorative hero, a results line and a toolbar on
     separate rows, and generous desktop padding throughout. A search app on a
     phone should lead with the search box and then get out of the way. */
  .wrap{display:flex;flex-direction:column;padding:0 14px}
  .searchbar{order:1;top:54px}
  #banner{order:2}
  .bar{order:4}
  #refine{order:5}
  #results{order:6}
  .hero{display:none}

  .top{padding:11px 14px}
  .railnav .tab{padding:8px 13px;font-size:13px}
  /* stacked label-over-value costs 68px of the first screen; inline costs 34 */

  /* results line and view control share one row instead of wrapping */
  .bar{flex-wrap:nowrap;gap:10px;align-items:center}
  .bar .meta{padding:10px 2px;flex:1;min-width:0}
  .kbd-hint{display:none}
  /* the chain button beside this line already says which network is on */
  .mnet{display:none}
  .viewtools{align-self:center}
  .sortbar:not(:empty){padding-bottom:8px}
  .sortbar button{padding:6px 11px}
  /* filter and sort are the same question on a phone &#8212; how do I narrow this &#8212;
     and two stacked strips cost a row of the first screen that the results need.
     One scroller carries both, chips wrapping onto no lines at all. */
  /* stacked, not side by side: two questions, one per line */
  .refine{display:block}
  .refine>*{overflow-x:auto;scrollbar-width:none;
    -webkit-mask-image:linear-gradient(90deg,#000 94%,transparent)}
  .refine>*::-webkit-scrollbar{display:none}
  .facetbar button{padding:6px 11px}
  /* two scrollers stacked: categories, then chains. Side by side, the chain
     chips end up off the right edge behind thirteen categories. */
  /* one row: categories scroll, the network button stays put at the end */
  .rail{position:static;height:auto;flex-direction:row;align-items:center;gap:8px;
    border-right:0;border-bottom:1px solid var(--line);padding:7px 0;overflow:visible}
  .railnav{flex-direction:row;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0;
    padding:0 0 0 14px;max-height:none;-webkit-mask-image:linear-gradient(90deg,#000 92%,transparent)}
  .railnav::-webkit-scrollbar{display:none}
  .railnav .tab{width:auto;flex:none;padding:6px 12px}
  .railnav .tab::before,.railnav .tab .ct{display:none}
  .railfoot{margin:0;gap:0;min-width:0;flex:none;flex-direction:row}
  .railk{display:none}
  /* one button instead of a thirty-chip scroller: saves a whole row of the
     first screen, and finding a network stops being a scroll hunt */
  .railchains{display:none}
  .chainbtn{display:flex;align-items:center;gap:7px;margin:0 14px 0 4px;padding:8px 12px;
    border-radius:999px;background:var(--surface);border:1px solid var(--line);
    color:var(--dim);font-size:13px;font-weight:600;white-space:nowrap;flex:none;align-self:flex-start}
  .chainbtn.on{color:var(--text);border-color:color-mix(in srgb,var(--c) 55%,transparent);
    background:color-mix(in srgb,var(--c) 14%,var(--surface))}
  .chainbtn .ch{width:14px;height:14px;opacity:.7;margin-left:-2px}
  .pickgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .pickgrid .chip{width:100%;justify-content:flex-start;padding:11px 12px;border-radius:12px}
  /* one scrolling strip, not three stacked rows eating the first screen */
  .thead{display:none}
}


/* ---- mobile ----
   Everything the desktop puts in a column header or a hover has to be reachable
   by thumb, and nothing inert should be on screen. */

/* sort chips: the column headers are hidden on a phone, so the same descriptor
   renders as a scrolling strip instead */
/* filter chips: the row that says what the category is being narrowed to.
   Always visible where a kind defines facets, on every width &#8212; unlike the sort
   strip, which only appears where the column headers cannot. */
.facetbar{display:none}
.facetbar:not(:empty){display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:0 0 10px}
.facetbar .sk{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--faint);flex:none;padding-right:2px}
.facetbar button{display:inline-flex;align-items:center;gap:7px;flex:none;padding:6px 11px;
  border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--dim);
  font-size:12.5px;font-weight:600;white-space:nowrap;transition:.14s var(--ease)}
.facetbar button:hover:not(:disabled){color:var(--text);border-color:var(--line2)}
.facetbar button.on{background:color-mix(in srgb,var(--accent) 15%,var(--surface2));
  color:var(--text);border-color:var(--accent-dim)}
.facetbar button:disabled{opacity:.38;cursor:default}
.facetbar .fn{font-size:11px;font-weight:600;color:var(--faint);font-variant-numeric:tabular-nums}
.facetbar button.on .fn{color:var(--accent)}
.mnote{color:var(--faint);margin-left:6px}

/* what a sentence was read as: stated, not applied silently */
.facetbar .rd{display:inline-flex;align-items:center;flex:none;padding:6px 11px;border-radius:999px;

.searchbar #q.read{font-style:italic}

/* the same row on All, where it reports the shape of a mixed result set */
.facetbar [data-jump]{border-style:dashed}
.facetbar [data-jump]:hover{border-style:solid}
.facetbar .clr{background:none;border-color:transparent;color:var(--faint)}

.sortbar{display:none}

.sortbar button.on{background:var(--surface2);color:var(--text);border-color:var(--accent-dim)}

/* grabber: present always, but only a bottom sheet is draggable */
.grab{display:none}

@media (max-width:900px){
  /* Stacked, one strip per question &#8212; so each strip has to stay one line. A
     wrapped filter row cost the first screen two rows of results; sideways is
     free here, because the strip is already a scroller. */
  .facetbar:not(:empty),.sortbar:not(:empty){display:flex;gap:6px;flex-wrap:nowrap;
    overflow-x:auto;padding:0 0 9px;scrollbar-width:none;
    -webkit-mask-image:linear-gradient(90deg,#000 94%,transparent)}
  .facetbar::-webkit-scrollbar,.sortbar::-webkit-scrollbar{display:none}

  #view{display:none}

  .grab{display:block;height:22px;margin:-8px 0 4px;position:relative;

  .row{gap:10px;padding:12px 11px}

   They are joined into one index: a lending market carries the protocol behind
   it, a protocol carries the chains it runs on, and every chain knows its own
   assets, markets and protocols. */

const YIELDS = 'https://yields.llama.fi';

   entitled to refuse a request that does not name a version. Sending it costs

// DeFiLlama is not always consistent about a chain's display name
for (const [alias, id] of Object.entries({ 'BNB': 'bnb', 'Binance': 'bnb', 'Avalanche C-Chain': 'avax',
