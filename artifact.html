<title>Atlas Onchain Search</title>
<meta name="description" content="One search bar for every chain. Assets, lending markets, and the protocols behind them.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Non-blocking: a pending stylesheet blocks script execution, so a slow or
     unreachable font host would leave the shell rendered and the app dead. -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet" media="print" onload="this.media='all';this.onload=null">
<style>
/* Atlas &#8212; Phantom-flavoured onchain search */
:root{
  --bg:#12121a; --bg2:#16161f; --surface:#1c1c27; --surface2:#22222f;
  --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.12);
  --text:#f4f3f8; --dim:#9a99ac; --faint:#67667a;
  --accent:#ab9ff2; --accent-dim:#8b7fe0;
  --up:#4ade80; --down:#ff6b81;
  --r:16px; --r-lg:22px;
  --ease:cubic-bezier(.22,.61,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--text); min-height:100vh;
  font:400 15px/1.5 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased; letter-spacing:-.01em;
  padding-bottom:80px;
}
button,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;flex:none}

/* ambient glow */
.aurora{position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(680px 380px at 50% -8%,rgba(171,159,242,.22),transparent 70%),
    radial-gradient(520px 320px at 88% 4%,rgba(97,214,214,.10),transparent 70%),
    radial-gradient(460px 300px at 6% 12%,rgba(255,107,129,.07),transparent 70%);
}

/* header */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;
  gap:16px;padding:14px 22px;backdrop-filter:blur(14px);
  background:linear-gradient(180deg,rgba(18,18,26,.9),rgba(18,18,26,.55));
  border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;color:var(--text);text-decoration:none;
  font-weight:700;font-size:16px;letter-spacing:-.03em}
.mark{width:20px;height:20px;border-radius:7px;
  background:conic-gradient(from 200deg,#ab9ff2,#61d6d6,#ff6b81,#ab9ff2);
  box-shadow:0 0 18px rgba(171,159,242,.5)}
.top-nav{display:flex;align-items:center;gap:12px}
.net{color:var(--faint);font-size:12.5px;font-weight:500}
.ghost-btn{display:flex;align-items:center;gap:8px;padding:7px 12px;border-radius:11px;
  background:var(--surface);border:1px solid var(--line);color:var(--dim);
  font-size:13px;font-weight:500;transition:.16s var(--ease)}
.ghost-btn:hover{background:var(--surface2);color:var(--text);border-color:var(--line2)}
kbd{font:inherit;font-size:11px;padding:1px 5px;border-radius:5px;background:rgba(255,255,255,.07);
  border:1px solid var(--line);color:var(--faint)}

.wrap{position:relative;z-index:1;max-width:880px;margin:0 auto;padding:0 20px}

/* hero */
.hero{text-align:center;padding:56px 0 26px;transition:.35s var(--ease)}
.hero h1{font-size:clamp(30px,6vw,44px);font-weight:700;letter-spacing:-.035em;line-height:1.08}
.hero em{font-style:normal;background:linear-gradient(100deg,#ab9ff2,#61d6d6);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.hero .sub{margin-top:12px;color:var(--dim);font-size:15px}
.hero .sub span{color:var(--accent)}
.hero h1,.hero .sub{transition:font-size .3s var(--ease),opacity .22s var(--ease),
  transform .3s var(--ease),margin .3s var(--ease)}
body.searching .hero{padding:20px 0 6px}
body.searching .hero h1{font-size:0;opacity:0;margin:0;transform:translateY(-10px)}
body.searching .hero .sub{font-size:0;opacity:0;margin:0;transform:translateY(-6px)}

/* search */
.searchbar{position:sticky;top:64px;z-index:15;display:flex;align-items:center;gap:12px;
  padding:0 16px;height:58px;border-radius:var(--r-lg);
  background:var(--surface);border:1px solid var(--line2);
  box-shadow:0 12px 40px -14px rgba(0,0,0,.8);
  transition:.22s var(--ease)}
.searchbar:focus-within{border-color:var(--accent-dim);background:var(--surface2);
  box-shadow:0 0 0 4px rgba(171,159,242,.14),0 16px 44px -14px rgba(0,0,0,.9)}
.lens{color:var(--faint);width:20px;height:20px;transition:.2s}
.searchbar:focus-within .lens{color:var(--accent)}
#q{flex:1;background:none;border:0;outline:0;font-size:17px;font-weight:500;letter-spacing:-.015em;min-width:0}
#q::placeholder{color:var(--faint);font-weight:400}
.clear{display:grid;place-items:center;width:26px;height:26px;border-radius:8px;color:var(--faint);
  background:rgba(255,255,255,.06);transition:.15s}
.clear:hover{color:var(--text);background:rgba(255,255,255,.12)}

/* filters */
.filters{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:18px 2px 4px}
.tabs{display:flex;gap:3px;padding:3px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.tab{padding:6px 13px;border-radius:9px;font-size:13px;font-weight:600;color:var(--dim);transition:.16s var(--ease)}
.tab:hover{color:var(--text)}
.tab[aria-selected=true]{background:var(--surface2);color:var(--text);box-shadow:0 1px 8px rgba(0,0,0,.35)}
.chains{display:flex;gap:6px;overflow-x:auto;flex:1;padding:2px 0 6px;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,#000 92%,transparent)}
.chains::-webkit-scrollbar{display:none}
.chip{display:flex;align-items:center;gap:6px;padding:6px 11px 6px 7px;border-radius:999px;flex:none;
  background:var(--surface);border:1px solid var(--line);color:var(--dim);
  font-size:12.5px;font-weight:600;white-space:nowrap;transition:.16s var(--ease)}
.chip:hover{color:var(--text);border-color:var(--line2)}
.chip[aria-pressed=true]{color:var(--text);border-color:color-mix(in srgb,var(--c) 55%,transparent);
  background:color-mix(in srgb,var(--c) 14%,var(--surface))}
.dot{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none;box-shadow:0 0 8px var(--c)}
.chip.all .dot{background:linear-gradient(120deg,#ab9ff2,#61d6d6)}

.meta{padding:14px 2px 10px;color:var(--faint);font-size:12.5px;font-weight:500;letter-spacing:.01em}

/* results */
.results{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:14px;padding:13px 16px;border-radius:var(--r);
  background:var(--surface);border:1px solid transparent;cursor:pointer;text-align:left;width:100%;
  transition:background .16s var(--ease),border-color .16s,transform .16s var(--ease)}
.row.in{animation:in .3s var(--ease) both}
@keyframes in{from{opacity:0;transform:translateY(7px)}}
.row:hover{background:var(--surface2)}
.row.sel{border-color:var(--accent-dim);background:var(--surface2);
  box-shadow:0 0 0 3px rgba(171,159,242,.12)}
.row:active{transform:scale(.994)}

/* 4-char tickers get a tighter face */
.tok.t4{font-size:9.5px;letter-spacing:-.04em}
.tok{width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center;
  font-size:12px;font-weight:700;letter-spacing:-.03em;color:#12121a;position:relative;
  background:linear-gradient(140deg,var(--c),color-mix(in srgb,var(--c) 45%,#fff))}
.tok.sq{border-radius:12px}
.tok .badge{position:absolute;right:-3px;bottom:-3px;width:15px;height:15px;border-radius:50%;
  background:var(--c2);border:2.5px solid var(--surface)}
.row:hover .tok .badge,.row.sel .tok .badge{border-color:var(--surface2)}

.body{flex:1;min-width:0}
.t1{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14.5px;letter-spacing:-.015em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t1 .sym{color:var(--faint);font-weight:500}
.t2{margin-top:2px;color:var(--dim);font-size:12.5px;display:flex;align-items:center;gap:7px;
  white-space:nowrap;overflow:hidden}
.t2 .sep{color:var(--faint);opacity:.5}
.tag{padding:2px 7px;border-radius:6px;background:rgba(255,255,255,.06);color:var(--dim);
  font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}

.num{text-align:right;flex:none;font-variant-numeric:tabular-nums}
.n1{font-weight:600;font-size:14.5px;letter-spacing:-.01em}
.n2{margin-top:2px;font-size:12.5px;font-weight:600}
.up{color:var(--up)}.down{color:var(--down)}
.n2.mute{color:var(--faint);font-weight:500}
.spark{width:62px;height:26px;flex:none;opacity:.85}
@media (max-width:560px){.spark{display:none}.t2 .tail{display:none}}

.empty{text-align:center;padding:60px 20px;color:var(--faint)}
.empty b{display:block;color:var(--text);font-size:16px;margin-bottom:6px;font-weight:600}
.gtitle{padding:16px 4px 6px;font-size:11.5px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:var(--faint)}

/* detail sheet */
.scrim{position:fixed;inset:0;z-index:30;background:rgba(8,8,12,.6);backdrop-filter:blur(3px);
  opacity:0;pointer-events:none;transition:opacity .3s var(--ease)}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:31;top:0;right:0;bottom:0;width:min(440px,100%);
  background:var(--bg2);border-left:1px solid var(--line);overflow-y:auto;
  transform:translateX(100%);transition:transform .32s var(--ease);visibility:hidden}
.sheet.open{transform:none;visibility:visible}
.sheet-in{padding:22px 24px 40px}
.sheet-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:22px}
.x{display:grid;place-items:center;width:32px;height:32px;border-radius:10px;color:var(--dim);
  background:var(--surface);border:1px solid var(--line);transition:.15s}
.x:hover{color:var(--text);background:var(--surface2)}
.sheet h2{font-size:20px;font-weight:700;letter-spacing:-.025em}
.sheet .hsub{color:var(--dim);font-size:13px;margin-top:3px}
.big{font-size:34px;font-weight:700;letter-spacing:-.035em;font-variant-numeric:tabular-nums}
.chgline{display:flex;align-items:center;gap:8px;margin-top:4px;font-size:13.5px;font-weight:600}
.chgline .mute{color:var(--faint);font-weight:500}
.chart{margin:20px 0 4px;border-radius:var(--r);overflow:hidden;background:var(--surface);
  border:1px solid var(--line);padding:14px 0 0}
.chart svg{display:block;width:100%;height:110px}
.rangebar{display:flex;gap:4px;padding:8px 12px 10px}
.rangebar span{padding:4px 9px;border-radius:7px;font-size:11.5px;font-weight:600;color:var(--faint)}
.rangebar span.on{background:var(--surface2);color:var(--text)}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.stat{padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.stat .k{color:var(--faint);font-size:11.5px;font-weight:600;letter-spacing:.03em;text-transform:uppercase}
.stat .v{margin-top:5px;font-size:16px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat.wide{grid-column:1/-1}
.util{margin-top:9px;height:6px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
.util i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),#61d6d6);
  animation:grow .5s var(--ease) both}
@keyframes grow{from{width:0!important}}

.sec{margin-top:26px}
.sec h3{font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--faint);margin-bottom:9px}
.mini{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:13px;width:100%;
  background:var(--surface);border:1px solid transparent;text-align:left;transition:.15s var(--ease);
  margin-bottom:6px;cursor:pointer}
.mini:hover{background:var(--surface2);border-color:var(--line2)}
.mini .tok{width:30px;height:30px;font-size:10px}
.mini .body .t1{font-size:13.5px}
.mini .body .t2{font-size:12px}
.mini .num .n1{font-size:13.5px}
.cta{display:flex;gap:9px;margin-top:24px}
.cta button{flex:1;padding:13px;border-radius:14px;font-size:14px;font-weight:600;transition:.16s var(--ease)}
.cta .p{background:var(--accent);color:#17121f;box-shadow:0 8px 24px -10px var(--accent)}
.cta .p:hover{background:#bcb1f6;transform:translateY(-1px)}
.cta .s{background:var(--surface);border:1px solid var(--line2);color:var(--text)}
.cta .s:hover{background:var(--surface2)}
.note{margin-top:14px;text-align:center;color:var(--faint);font-size:11.5px}

@media (max-width:640px){
  .top{padding:12px 16px}.wrap{padding:0 14px}
  .hero{padding:34px 0 18px}
  .hero .sub{font-size:14px;max-width:22em;margin-inline:auto}
  .searchbar{top:60px;height:54px}
  .row{padding:12px 13px;gap:11px}
  .sheet{width:100%;top:auto;height:92vh;border-left:0;border-top:1px solid var(--line);
    border-radius:24px 24px 0 0;transform:translateY(100%)}
  .stats{grid-template-columns:1fr 1fr}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ---- live data: logos, skeletons, banners, watchlist ---- */
.tok{position:relative;overflow:visible}
.tok img{position:absolute;inset:0;width:100%;height:100%;border-radius:inherit;object-fit:cover;
  opacity:0;transition:opacity .25s var(--ease)}
.tok .badge{z-index:1}
.ghost-btn.icon{padding:7px}
.ghost-btn.icon .i{width:16px;height:16px}
#refresh:active .i{transform:rotate(180deg);transition:transform .4s var(--ease)}

.star{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;flex:none;
  color:var(--faint);opacity:0;transition:.15s var(--ease)}
.star .i{width:16px;height:16px;stroke-width:1.7}
.row:hover .star,.row.sel .star,.star.on,.star:focus-visible{opacity:1}
.star:hover{background:rgba(255,255,255,.08);color:var(--text)}
.star.on{color:#ffc960;opacity:1}
.star.on .i{fill:#ffc960;stroke:#ffc960}
.acts .star{opacity:1;width:32px;height:32px;border-radius:10px;background:var(--surface);border:1px solid var(--line)}
@media (hover:none){.star{opacity:1}}

/* skeletons */
.row.sk{cursor:default;pointer-events:none}
.row.sk .tok,.ln{background:linear-gradient(100deg,var(--surface2) 30%,rgba(255,255,255,.07) 50%,var(--surface2) 70%);
  background-size:220% 100%;animation:shimmer 1.4s linear infinite}
.row.sk .body{display:flex;flex-direction:column;gap:7px}
.ln{height:10px;border-radius:6px}
.w40{width:40%}.w25{width:25%}.w15{width:64px;height:14px;flex:none}
@keyframes shimmer{to{background-position:-220% 0}}

.cload{height:110px;display:grid;place-items:center;color:var(--faint);font-size:12.5px}
.cload:not(.err){background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.05) 50%,transparent 70%);
  background-size:220% 100%;animation:shimmer 1.4s linear infinite}

.warn{display:flex;align-items:center;gap:10px;margin-top:14px;padding:10px 14px;border-radius:13px;
  background:rgba(255,201,96,.09);border:1px solid rgba(255,201,96,.25);color:#ffd68a;font-size:13px}
.warn button{margin-left:auto;padding:4px 10px;border-radius:8px;background:rgba(255,255,255,.1);
  color:inherit;font-size:12px;font-weight:600;flex:none}
.warn button:hover{background:rgba(255,255,255,.18)}

.sheet-top .ident{display:flex;gap:12px;align-items:center;min-width:0}
.sheet-top .ident h2{overflow-wrap:anywhere}
.sheet-top .acts{display:flex;gap:6px;flex:none}
.note.l{text-align:left;margin-top:0}
.cta a{display:grid;place-items:center;text-decoration:none}
.cta.one{margin-top:18px;justify-content:center}
.cta.one button{flex:0 0 auto;padding:11px 22px}
.rangebar span{cursor:pointer}
.rangebar span:hover{color:var(--dim)}
.empty .cta{max-width:220px;margin-inline:auto}

/* ---- fluidity + focus ---- */
.results{transition:opacity .18s var(--ease)}
.results.stale{opacity:.45;pointer-events:none}   /* chain loading, not a skeleton flash */

:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row:focus-visible,.mini:focus-visible{outline-offset:-2px}
#q:focus-visible{outline:none}

.rangebar span{transition:background .15s var(--ease),color .15s var(--ease)}
.chip,.tab,.row,.mini{-webkit-tap-highlight-color:transparent}
.mini{transition:background .15s var(--ease),border-color .15s var(--ease),transform .15s var(--ease)}
.mini:active{transform:scale(.99)}

/* sample-data notice: informational, not an error &#8212; reads as part of the system */
.sample{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;margin-top:14px;padding:11px 15px;
  border-radius:13px;font-size:13px;line-height:1.45;color:#cfc7ff;
  background:linear-gradient(90deg,rgba(171,159,242,.14),rgba(171,159,242,.05));
  border:1px solid rgba(171,159,242,.3)}
.sample b{color:var(--text);font-weight:600}

</style>

<div class="aurora" aria-hidden="true"></div>

<header class="top">
  <a class="brand" href="#" aria-label="Atlas home">
    <span class="mark" aria-hidden="true"></span>
    <span>atlas</span>
  </a>
  <nav class="top-nav">
    <span class="net" id="netCount"></span>
    <button class="ghost-btn icon" id="refresh" aria-label="Refresh data" title="Refresh live data">
      <svg viewBox="0 0 24 24" class="i"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v4h-4"/></svg>
    </button>
    <button class="ghost-btn" id="topSearch">
      <svg viewBox="0 0 24 24" class="i"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>
      Search <kbd>/</kbd>
    </button>
  </nav>
</header>

<main class="wrap">
  <section class="hero" id="hero">
    <h1>Search everything <em>onchain</em></h1>
    <p class="sub">Assets and lending markets across <span id="chainWord">12 networks</span> &#8212; one bar, no wallet required.</p>
  </section>

  <div class="searchbar" id="searchbar">
    <svg viewBox="0 0 24 24" class="i lens"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>
    <input id="q" type="text" role="combobox" aria-expanded="true" aria-controls="results" aria-autocomplete="list" autocomplete="off" spellcheck="false" placeholder="Search any asset, protocol or lending market&#8230;" aria-label="Search assets and lending markets">
    <button class="clear" id="clear" hidden aria-label="Clear search">
      <svg viewBox="0 0 24 24" class="i"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>

  <div class="filters">
    <div class="tabs" id="tabs" role="tablist"></div>
    <div class="chains" id="chains"></div>
  </div>

  <div id="banner"></div>
  <div class="meta" id="meta"></div>
  <div id="results" class="results" role="listbox" aria-label="Results"></div>
</main>

<aside class="sheet" id="sheet" aria-hidden="true" tabindex="-1"></aside>
<div class="scrim" id="scrim"></div>

<script type="module">

(() => {
/* Sample dataset for the hosted artifact, where a strict CSP blocks every
   external request. Deterministic, plausible, and clearly labelled in the UI \u2014
   it is illustrative, not a market snapshot. Only the artifact build ships it. */
const A = [

  ['binancecoin','bnb','BNB',712.30,0.94,1.02e11,1.80e9],    ['usd-coin','usdc','USDC',0.9999,0.00,4.12e10,7.10e9],
  ['lido-staked-ether','steth','Lido Staked Ether',3402.10,-1.18,1.89e10,1.20e8],
  ['wrapped-bitcoin','wbtc','Wrapped Bitcoin',96180,1.79,1.34e10,4.10e8],
  ['chainlink','link','Chainlink',22.14,2.35,1.38e10,5.40e8], ['sui','sui','Sui',3.86,6.14,1.24e10,1.10e9],
  ['hyperliquid','hype','Hyperliquid',34.80,8.05,1.16e10,7.80e8], ['avalanche-2','avax','Avalanche',41.20,2.66,1.71e10,6.20e8],
  ['uniswap','uni','Uniswap',12.06,-0.78,7.20e9,2.90e8],     ['aptos','apt','Aptos',9.34,-1.28,5.80e9,2.40e8],

        ? `<div class="empty"><b>Nothing saved yet</b>Tap the star on any asset or market to pin it here. Saved items persist in this browser.</div>`
      : !S.q && S.chain && !S.assets.length
        ? `<div class="empty"><b>No assets indexed for ${esc(CH[S.chain].name)}</b>CoinGecko returned nothing for the \u201c${esc(CH[S.chain].cg)}\u201d category. Slugs get renamed occasionally \u2014 the mapping is the CHAINS table in data.js.</div>`
      : `<div class="empty"><b>Nothing matched \u201c${esc(S.q.trim())}\u201d</b>Try a ticker like SOL, a protocol like Aave, or \u201cusdc lending\u201d.</div>`;
    return;
  }
  const frag = document.createDocumentFragment();
  let last = null;
  list.forEach((it, i) => {
    if (S.tab !== 'assets' && S.tab !== 'lending' && it.kind !== last) {
      const h = document.createElement('div');
      h.className = 'gtitle'; h.setAttribute('role', 'presentation');
      h.textContent = it.kind === 'asset' ? 'Assets' : 'Lending markets';
      frag.appendChild(h); last = it.kind;
    }
    frag.appendChild(nodeFor(it, i));
  });
  el.res.replaceChildren(frag);
  paintSel();
}

/* ---------- detail sheet ---------- */
let depth = 0;                       // sheet entries pushed since the sheet opened
const find = id => S.assets.find(x => x.id === id) || S.pools.find(x => x.id === id) || S.watch.get(id);
const stat = (k, v, extra = '') => `<div class="stat"><div class="k">${k}</div><div class="v">${v}</div>${extra}</div>`;

function sheetHTML(it) {
  const c = CH[it.chain];
  const back = depth > 1 ? `<button class="x" data-back aria-label="Back"><svg viewBox="0 0 24 24" class="i"><path d="M15 5l-7 7 7 7"/></svg></button>` : '';
  const head = (t, sub) => `<div class="sheet-top">
    <div class="ident">${tok(it, it.kind === 'pool')}<div><h2>${esc(t)}</h2><div class="hsub">${esc(sub)}</div></div></div>
    <div class="acts">${star(it)}${back}<button class="x" data-close aria-label="Close"><svg viewBox="0 0 24 24" class="i"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div></div>`;
  const ranges = (days, opts) => `<div class="rangebar">${opts.map(([d, l]) =>
    `<span class="${d === days ? 'on' : ''}" data-days="${d}" role="button" tabindex="0">${l}</span>`).join('')}</div>`;
  const chartBox = (days, opts) => `<div class="chart"><div class="chart-svg"><div class="cload"></div></div>${ranges(days, opts)}</div>`;

  if (it.kind === 'asset') {
    const markets = S.pools.filter(p => p.sym === it.sym).sort((a, b) => b.supplyUsd - a.supplyUsd).slice(0, 6);
    return `<div class="sheet-in" data-kind="asset" data-cg="${esc(it.cg)}" data-up="${it.chg >= 0}">
      ${head(it.name, [it.sym, c?.name, it.rank ? '#' + it.rank : ''].filter(Boolean).join(' \u00b7 '))}
      <div class="big">${usd(it.price)}</div>
      <div class="chgline"><span class="${it.chg >= 0 ? 'up' : 'down'}">${pct(it.chg)}</span><span class="mute">past 24 hours</span></div>
      ${chartBox(1, [[1, '1D'], [7, '1W'], [30, '1M'], [365, '1Y']])}
      <div class="stats">
        ${stat('Market cap', '$' + compact(it.mcap))}
        ${stat('24h volume', '$' + compact(it.vol))}
        ${c ? stat('Network', esc(c.name)) : stat('Lending markets', String(markets.length))}
        ${stat('Rank', it.rank ? '#' + it.rank : '\u2014')}
      </div>
      <div class="sec"><h3>Lend or borrow ${esc(it.sym)}</h3>
        ${markets.length ? markets.map(miniHTML).join('')
        : `<div class="note l">${S.pools.length ? 'No lending market indexed for this asset.' : 'Lending data unavailable right now.'}</div>`}
      </div>
      <div class="cta"><a class="p" href="${esc(links.asset(it))}" target="_blank" rel="noopener noreferrer">View on CoinGecko \u2197</a></div>
      <div class="note">${flags.sample ? 'Sample data \u2014 illustrative only.' : 'Live prices from CoinGecko.'} Not financial advice.</div>
    </div>`;
  }

  const a = S.assets.find(x => x.sym === it.sym);
  const others = S.pools.filter(p => p.sym === it.sym && p.id !== it.id).sort((x, y) => y.sup - x.sup).slice(0, 4);
  return `<div class="sheet-in" data-kind="pool" data-pool="${esc(it.pool)}" data-up="true">
    ${head(it.proto, `${it.sym}${it.meta ? ' \u00b7 ' + it.meta : ''} \u00b7 ${c?.name || ''}`)}
    <div class="big up">${apy(it.sup)}</div>
    <div class="chgline"><span class="mute">supply APY${it.supReward ? ` \u00b7 ${apy(it.supBase)} base + ${apy(it.supReward)} rewards` : ''}</span></div>
    ${chartBox(30, [[7, '1W'], [30, '1M'], [90, '3M'], [365, 'All']])}
    <div class="stats">
      ${stat('Total supplied', '$' + compact(it.supplyUsd))}
      ${stat('Total borrowed', '$' + compact(it.borrowUsd))}
      ${stat('Borrow APY', apy(it.bor))}
      ${stat('Max LTV', it.ltv ? (it.ltv * 100).toFixed(0) + '%' : '\u2014')}
      <div class="stat wide"><div class="k">Utilization</div><div class="v">${it.util.toFixed(0)}%</div>
        <div class="util"><i style="width:${it.util.toFixed(0)}%"></i></div></div>
    </div>
    ${a ? `<div class="sec"><h3>Collateral asset</h3>${miniHTML(a)}</div>` : ''}
    ${others.length ? `<div class="sec"><h3>Other ${esc(it.sym)} markets</h3>${others.map(miniHTML).join('')}</div>` : ''}
    <div class="cta"><a class="p" href="${esc(links.pool(it))}" target="_blank" rel="noopener noreferrer">Open on DeFiLlama \u2197</a></div>
    <div class="note">${flags.sample ? 'Sample data \u2014 illustrative only.' : 'Live yields from DeFiLlama.'} Not financial advice.</div>
  </div>`;
}

function miniHTML(it) {
  const c = CH[it.chain];
  return it.kind === 'asset'
    ? `<div class="mini" data-id="${esc(it.id)}" role="button" tabindex="0">${tok(it)}
        <div class="body"><div class="t1">${esc(it.name)}</div><div class="t2">${[esc(it.sym), esc(c?.name || '')].filter(Boolean).join(' \u00b7 ')}</div></div>
        <div class="num"><div class="n1">${usd(it.price)}</div><div class="n2 ${it.chg >= 0 ? 'up' : 'down'}">${pct(it.chg)}</div></div></div>`
    : `<div class="mini" data-id="${esc(it.id)}" role="button" tabindex="0">${tok(it, 1)}
        <div class="body"><div class="t1">${esc(it.proto)}</div><div class="t2">${[esc(c?.name || ''), esc(it.meta), '$' + compact(it.supplyUsd) + ' supplied'].filter(Boolean).join(' \u00b7 ')}</div></div>
        <div class="num"><div class="n1 up">${apy(it.sup)}</div><div class="n2 mute">supply</div></div></div>`;
}

async function drawChart(days) {
  const box = el.sheet.querySelector('.sheet-in'); if (!box) return;
  const host = box.querySelector('.chart-svg');
  const token = host.dataset.token = String(Date.now());
  host.innerHTML = '<div class="cload"></div>';
  let pts = [];
  try {
    pts = box.dataset.kind === 'asset'
      ? await loadAssetChart(box.dataset.cg, days)
      : await loadPoolChart(box.dataset.pool, days);
  } catch { /* fall through to the empty state */ }
  if (host.dataset.token !== token) return;              // a newer range won
  if (pts.length < 2) { host.innerHTML = '<div class="cload err">No history available</div>'; return; }
  const stroke = box.dataset.up === 'true' ? 'var(--up)' : 'var(--down)';
  const d = path(pts, 300, 96, 6);
  host.innerHTML = `<svg viewBox="0 0 300 108" preserveAspectRatio="none">
    <defs><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${stroke}" stop-opacity=".28"/><stop offset="1" stop-color="${stroke}" stop-opacity="0"/></linearGradient></defs>
    <path d="${d}L300 108L0 108Z" fill="url(#cg)"/>
    <path d="${d}" fill="none" stroke="${stroke}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}

function open(id, { push = true } = {}) {
  const it = find(id); if (!it) return;
  const hash = '#' + id.replace(':', '/');
  if (push) history.pushState({ id, depth: ++depth }, '', hash);
  else depth = history.state?.depth ?? 0;
  el.sheet.innerHTML = sheetHTML(it);
  el.sheet.classList.add('open'); el.sheet.setAttribute('aria-hidden', 'false');
  el.scrim.classList.add('on'); el.sheet.scrollTop = 0; el.sheet.focus();
  drawChart(it.kind === 'asset' ? 1 : 30);
}
function hide() {
  depth = 0;
  el.sheet.classList.remove('open'); el.sheet.setAttribute('aria-hidden', 'true');
  el.scrim.classList.remove('on'); if (!coarse) el.q.focus();
}
/** Close = rewind past every sheet entry, so browser back never re-opens it. */
function close() {
  if (depth > 0) return history.go(-depth);          // popstate hides it
  history.replaceState(null, '', location.pathname + location.search);
  hide();
}

/* ---------- url state ---------- */
let urlT;
function syncUrl(now) {
  clearTimeout(urlT);
  const write = () => {
    const p = new URLSearchParams();
    if (S.q.trim()) p.set('q', S.q.trim());
    if (S.chain) p.set('chain', S.chain);
    if (S.tab !== 'all') p.set('tab', S.tab);
    history.replaceState(history.state, '', (p.toString() ? '?' + p : location.pathname) + location.hash);
  };
  now ? write() : (urlT = setTimeout(write, 350));
}
function fromUrl() {
  const p = new URLSearchParams(location.search);
  S.q = el.q.value = p.get('q') || '';
  S.chain = CH[p.get('chain')] ? p.get('chain') : null;
  S.tab = ['assets', 'lending', 'saved'].includes(p.get('tab')) ? p.get('tab') : 'all';
  paintFilters();
}

/* ---------- chrome ---------- */
const TABS = [['all', 'All'], ['assets', 'Assets'], ['lending', 'Lending'], ['saved', 'Saved']];
$('#tabs').innerHTML = TABS.map(([k, l]) => `<button class="tab" role="tab" data-tab="${k}" aria-selected="false">${l}</button>`).join('');
$('#chains').innerHTML = `<button class="chip all" data-chain="" aria-pressed="true"><span class="dot"></span>All chains</button>` +
  CHAINS.map(([id, name, color]) => `<button class="chip" data-chain="${id}" aria-pressed="false" style="--c:${color}"><span class="dot"></span>${name}</button>`).join('');
$('#netCount').textContent = `${CHAINS.length} networks`;
$('#chainWord').textContent = `${CHAINS.length} networks`;
function paintFilters() {
  document.querySelectorAll('[data-tab]').forEach(t => t.setAttribute('aria-selected', t.dataset.tab === S.tab));
  document.querySelectorAll('[data-chain]').forEach(t => t.setAttribute('aria-pressed', (t.dataset.chain || null) === S.chain));
}

/* ---------- events ---------- */
el.q.addEventListener('input', e => { S.q = e.target.value; S.sel = 0; render(); scrollToResults(); syncUrl(); });
el.clear.addEventListener('click', () => { S.q = el.q.value = ''; S.sel = 0; render(); syncUrl(true); el.q.focus(); });
$('#topSearch').addEventListener('click', () => el.q.focus());
$('#refresh').addEventListener('click', () => load({ force: true }));

$('#tabs').addEventListener('click', e => {
  const b = e.target.closest('[data-tab]'); if (!b) return;
  S.tab = b.dataset.tab; S.sel = 0; paintFilters(); reindex(); render(); scrollToResults(); syncUrl(true);
});
let chainSeq = 0;
$('#chains').addEventListener('click', async e => {
  const b = e.target.closest('[data-chain]'); if (!b) return;
  const seq = ++chainSeq;
  S.chain = b.dataset.chain || null; S.sel = 0; paintFilters();
  S.loading = true; el.res.classList.add('stale'); render();
  let assets = null, err = null;
  try { assets = await loadAssets(S.chain); } catch (e2) { err = e2; }
  if (seq !== chainSeq) return;                 // a newer chain click won the race
  S.assets = assets || [];
  S.warn = err ? 'Asset prices unavailable \u2014 ' + err.message : null;
  S.loading = false; el.res.classList.remove('stale');
  nodes.clear(); reindex(); render(); scrollToResults(); syncUrl(true);
});

function toggleStar(id) {
  const it = find(id); if (!it) return;
  S.watch.has(id) ? S.watch.delete(id) : S.watch.set(id, it);
  saveWatch();
  document.querySelectorAll(`[data-star="${CSS.escape(id)}"]`).forEach(b => {
    b.classList.toggle('on', S.watch.has(id)); b.setAttribute('aria-pressed', S.watch.has(id));
  });
  if (S.tab === 'saved') { reindex(); render(); }
}
el.res.addEventListener('click', e => {
  if (e.target.closest('[data-retry]')) return load({ force: true });
  const s = e.target.closest('[data-star]'); if (s) return toggleStar(s.dataset.star);
  const r = e.target.closest('.row:not(.sk)'); if (r) open(r.dataset.id);
});
el.banner.addEventListener('click', e => e.target.closest('[data-retry]') && load({ force: true }));

el.sheet.addEventListener('click', e => {
  const s = e.target.closest('[data-star]'); if (s) return toggleStar(s.dataset.star);
  if (e.target.closest('[data-close]')) return close();
  if (e.target.closest('[data-back]')) return history.back();
  const d = e.target.closest('[data-days]');
  if (d) {
    el.sheet.querySelectorAll('[data-days]').forEach(x => x.classList.toggle('on', x === d));
    return drawChart(+d.dataset.days);
  }
  const m = e.target.closest('.mini'); if (m) open(m.dataset.id);
});
el.sheet.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.closest('[data-days],.mini')) {
    e.preventDefault(); e.target.closest('[data-days],.mini').click();
  }
});
el.scrim.addEventListener('click', () => close());

addEventListener('popstate', () => {
  const h = location.hash.slice(1), id = h && h.replace('/', ':');
  if (id && find(id)) return open(id, { push: false });
  hide();
});

addEventListener('keydown', e => {
  if (e.key === 'Escape') { el.sheet.classList.contains('open') ? close() : (S.q = el.q.value = '', render(), syncUrl(true)); return; }
  if (el.sheet.classList.contains('open')) return;
  if ((e.key === '/' || (e.key === 'k' && (e.metaKey || e.ctrlKey))) && document.activeElement !== el.q) {
    e.preventDefault(); el.q.focus(); el.q.select(); return;
  }
  if (!S.list.length) return;
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    S.sel = (S.sel + (e.key === 'ArrowDown' ? 1 : -1) + S.list.length) % S.list.length;
    paintSel(true);
  } else if (e.key === 'Enter' && S.list[S.sel]) open(S.list[S.sel].id);
});

/* ---------- go ---------- */
// The shell is static HTML, so a boot failure would otherwise look like a page
// whose search box simply ignores you. Say what happened instead.
addEventListener('error', e => {
  if (S.assets.length || S.pools.length) return;
  el.res.innerHTML = `<div class="empty"><b>The app failed to start</b>${esc(e.message || 'Unknown error')}</div>`;
});

fromUrl();
load().then(() => {
  const id = location.hash.slice(1).replace('/', ':');
  if (id && find(id)) { history.replaceState({ id, depth: 0 }, '', location.href); open(id, { push: false }); }
});
if (!coarse) el.q.focus();

</script>
