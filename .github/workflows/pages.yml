name: Deploy demo to GitHub Pages

# Dormant until Pages is switched on: a workflow token may not create the Pages
# site itself, so this checks first and skips cleanly instead of failing. Turn
# it on under Settings -> Pages -> Source: GitHub Actions and the next push
# publishes automatically.

on:
  push:
    branches: [claude/web3-blockchain-search-lzaknw]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.probe.outputs.enabled }}
    steps:
      - id: probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages is not enabled — skipping deploy. Enable it under Settings > Pages > Source: GitHub Actions and the next push will publish."
          fi

  deploy:
    needs: check
    if: needs.check.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # ship only the site itself — tests and tooling stay out of the bundle
      - name: Assemble site
        run: |
          mkdir -p _site/vendor
          cp index.html styles.css app.js data.js _site/
          cp vendor/fuse.mjs vendor/fuse.LICENSE _site/vendor/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
