name: Deploy demo to GitHub Pages

on:
  push:
    branches: [claude/web3-blockchain-search-lzaknw]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # ship only the site itself — tests and tooling stay out of the bundle
      - name: Assemble site
        run: |
          mkdir -p _site/vendor
          cp index.html styles.css app.js data.js _site/
          cp vendor/fuse.mjs vendor/fuse.LICENSE _site/vendor/

      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
