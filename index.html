<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Atlas Onchain Search</title>
<meta name="description" content="One search bar for every chain. Assets, NFTs, yields, lending markets, protocols, stablecoins, bridges, funding rounds and exploits.">
<meta name="theme-color" content="#12121a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Non-blocking: a pending stylesheet blocks script execution, so a slow or
     unreachable font host would leave the shell rendered and the app dead. -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet" media="print" onload="this.media='all';this.onload=null">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%23006fcf'/></svg>">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="aurora" aria-hidden="true"></div>

<header class="top">
  <a class="brand" href="#" aria-label="Atlas home">
    <span class="mark" aria-hidden="true"></span>
    <span>atlas</span>
  </a>
  <nav class="top-nav">
    <span class="net" id="netCount"></span>
    <button class="ghost-btn icon" id="refresh" aria-label="Refresh data" title="Refresh live data">
      <svg viewBox="0 0 24 24" class="i"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v4h-4"/></svg>
    </button>
    <button class="ghost-btn" id="topSearch">
      <svg viewBox="0 0 24 24" class="i"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>
      Search <kbd>/</kbd>
    </button>
    <button class="ghost-btn wallet" id="connect" aria-haspopup="dialog">
      <svg viewBox="0 0 24 24" class="i"><path d="M3 8.5A2.5 2.5 0 0 1 5.5 6H18a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5.5A2.5 2.5 0 0 1 3 16.5z"/><path d="M16 12.5h.01"/></svg>
      <span>Connect</span>
    </button>
  </nav>
</header>

<div class="app">
<aside class="rail" id="rail">
  <nav class="railnav" id="tabs" role="tablist" aria-label="Categories"></nav>
  <div class="railfoot">
    <div class="railk">Network</div>
    <button class="chainbtn" id="chainbtn" aria-haspopup="dialog"><span class="dot"></span><span class="cn">All chains</span>
      <svg viewBox="0 0 24 24" class="i ch"><path d="m6 9 6 6 6-6"/></svg></button>
    <div class="railchains" id="chains"></div>
  </div>
</aside>

<main class="wrap">
  <section class="hero" id="hero">
    <h1>Search everything <em>onchain</em></h1>
    <p class="sub">Assets, NFTs, yields, protocols, bridges and more across <span id="chainWord">30 networks</span> — one bar, no wallet required.</p>
  </section>

  <div class="searchbar" id="searchbar">
    <svg viewBox="0 0 24 24" class="i lens"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>
    <input id="q" type="text" role="combobox" aria-expanded="true" aria-controls="results" aria-autocomplete="list" autocomplete="off" spellcheck="false" placeholder="Search assets, NFTs, protocols, yields, bridges, exploits…" aria-label="Search assets and lending markets">
    <button class="clear" id="clear" hidden aria-label="Clear search">
      <svg viewBox="0 0 24 24" class="i"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>

  <div id="banner"></div>
  <div class="bar">
    <div class="meta" id="meta"></div>
    <div class="viewtools">
      <button class="catbtn" id="catbtn" aria-haspopup="dialog" hidden>
        <span class="cn">All</span>
        <svg viewBox="0 0 24 24" class="i ch"><path d="m6 9 6 6 6-6"/></svg></button>
      <button class="vt" id="view" title="Table or cards">
        <svg viewBox="0 0 24 24" class="i"><path d="M4 5h16v14H4z"/><path d="M4 10h16M10 10v9"/></svg><span>Table</span>
      </button>
    </div>
  </div>
  <div class="refine" id="refine">
    <div class="facetbar" id="facetbar" aria-label="Filter"></div>
    <div class="sortbar" id="sortbar" aria-label="Sort"></div>
  </div>
  <div id="results" class="results" role="listbox" aria-label="Results"></div>
</main>
</div>

<aside class="sheet" id="sheet" aria-hidden="true" tabindex="-1"></aside>
<div class="scrim" id="scrim"></div>

<script type="module" src="app.js"></script>
</body>
</html>
